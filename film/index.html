<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You, Yourself · The Film</title>
<meta name="description" content="A short film, based on a true story: a teacher who hears a voice saying “come home”, the drawings that helped, and the wearable we built.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#f4f1e8;--mute:#a7a6c4;--gold:#f5c04e;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px;z-index:5;cursor:pointer;
  background:radial-gradient(900px 520px at 50% 62%,rgba(58,35,80,.55) 0%,rgba(0,0,0,.92) 70%),url(poster.jpg) center/cover no-repeat}
#start .k{color:var(--gold);font-size:.78rem;letter-spacing:.32em;text-transform:uppercase}
#start h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2.4rem,8vw,5.6rem);margin:.18em 0 .1em;letter-spacing:-.01em}
#start .tag{font-family:Fraunces,Georgia,serif;font-style:italic;color:#e6dfd2;font-size:clamp(1.05rem,2.6vw,1.4rem);margin:0}
#start .play{width:84px;height:84px;border-radius:50%;border:1.5px solid rgba(245,192,78,.8);display:grid;place-items:center;margin:30px auto 14px;
  background:rgba(245,192,78,.12);transition:background .2s,transform .2s}
#start:hover .play{background:rgba(245,192,78,.25);transform:scale(1.04)}
#start .play i{width:0;height:0;border-left:22px solid var(--gold);border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
#start small{display:block;color:var(--mute);font-size:.8rem;letter-spacing:.06em}
#ui{position:fixed;left:0;right:0;bottom:0;padding:14px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .4s;z-index:4}
body.idle #ui{opacity:0}
body.idle{cursor:none}
.bar{position:relative;height:22px;cursor:pointer;margin-bottom:8px}
.bar .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.bar .buf{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.bar .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--gold)}
.bar .mk{position:absolute;top:5px;width:2px;height:12px;background:rgba(255,255,255,.5)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,a.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 .85rem Inter,sans-serif;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--gold)}
#time{font:500 .85rem "JetBrains Mono",monospace;color:var(--mute);min-width:96px}
#chapters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#chapters button{font-weight:500;padding:6px 10px;font-size:.78rem}
#chapters button.on{border-color:var(--gold);color:var(--gold)}
@media(max-width:760px){#chapters{display:none}#ui .row{justify-content:space-between}}
</style>
</head>
<body>
<div id="stage"><video id="v" src="you-yourself-film.mp4" preload="metadata" playsinline poster="poster.jpg"></video></div>
<div id="start" role="button" tabindex="0" aria-label="Play the film">
  <div>
    <div class="k">A short film</div>
    <h1>You, Yourself</h1>
    <p class="tag">Based on a true story.</p>
    <div class="play"><i></i></div>
    <small>2:49 · English, with captions · sound on</small>
  </div>
</div>
<div id="ui">
  <div class="bar" id="bar"><div class="track"></div><div class="buf" id="buf"></div><div class="fill" id="fill"></div></div>
  <div class="row">
    <button id="pp">Pause</button>
    <span id="time">0:00 / 0:00</span>
    <div id="chapters"></div>
    <a class="btn" href="you-yourself-film.mp4" download>Download MP4</a>
    <a class="btn" href="../index.html#sim">Try the demo</a>
    <button id="fs">Fullscreen</button>
  </div>
</div>
<script>
(async () => {
  const v = document.getElementById('v'), fill = document.getElementById('fill'), buf = document.getElementById('buf'), bar = document.getElementById('bar');
  const pp = document.getElementById('pp'), time = document.getElementById('time'), chWrap = document.getElementById('chapters'), start = document.getElementById('start');
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const tl = await fetch('timeline.json').then((r) => r.json()).catch(() => ({ duration: 0, chapters: [] }));
  const dur = () => v.duration || tl.duration || 1;
  tl.chapters.forEach((c) => {
    const m = document.createElement('div'); m.className = 'mk'; m.style.left = (c.t / tl.duration * 100) + '%'; bar.appendChild(m);
    const b = document.createElement('button'); b.textContent = c.label; b.onclick = () => seek(c.t + 0.01); chWrap.appendChild(b);
  });
  const seek = (s) => { v.currentTime = Math.max(0, Math.min(dur() - 0.05, s)); };
  const t0 = parseFloat(new URLSearchParams(location.search).get('t') || '0');
  const cant = () => { start.style.display = ''; start.querySelector('small').innerHTML = 'This browser can’t play the video here. <a href="you-yourself-film.mp4" download style="color:#f5c04e">Download the MP4</a> instead.'; };
  const play = () => { const r = v.play(); if (r && r.catch) r.catch((e) => { if (e.name !== 'AbortError') cant(); }); };
  const begin = () => { start.style.display = 'none'; if (t0) v.currentTime = t0; play(); };
  start.onclick = begin; start.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } };
  const toggle = () => { if (v.paused) play(); else v.pause(); };
  v.onplay = () => { pp.textContent = 'Pause'; }; v.onpause = () => { pp.textContent = 'Play'; };
  v.onended = () => { pp.textContent = 'Replay'; document.body.classList.remove('idle'); };
  pp.onclick = () => (v.ended ? (seek(0), play()) : toggle());
  v.onclick = toggle;
  bar.onclick = (e) => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * dur()); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  v.ontimeupdate = () => {
    const t = v.currentTime;
    fill.style.width = (t / dur() * 100) + '%';
    time.textContent = `${fmt(t)} / ${fmt(dur())}`;
    const cur = [...tl.chapters].reverse().find((c) => t >= c.t);
    [...chWrap.children].forEach((b) => b.classList.toggle('on', !!cur && b.textContent === cur.label));
  };
  v.onprogress = () => { if (v.buffered.length) buf.style.width = (v.buffered.end(v.buffered.length - 1) / dur() * 100) + '%'; };
  addEventListener('keydown', (e) => {
    if (start.style.display !== 'none') return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') seek(v.currentTime + 5);
    else if (e.key === 'ArrowLeft') seek(v.currentTime - 5);
    else if (e.key.toLowerCase() === 'f') document.getElementById('fs').click();
    else if (/^[1-9]$/.test(e.key) && tl.chapters[+e.key - 1]) seek(tl.chapters[+e.key - 1].t + 0.01);
  });
  let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => !v.paused && document.body.classList.add('idle'), 2500); });
})();
</script>
</body>
</html>
