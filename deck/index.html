<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You, Yourself · Pitch deck</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#14142b;--bg2:#1d1d3a;--ink:#f6f4ee;--mute:#aaa8c8;--gold:#f5c04e;--teal:#3fc0ae;--rose:#ff8aa0;--line:#35355f;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b1a;color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#deck{width:1280px;height:720px;position:relative;transform-origin:center;flex:none}
.slide{position:absolute;inset:0;padding:56px 72px;background:radial-gradient(900px 500px at 85% -10%,#2c2c63 0%,transparent 70%),var(--bg);display:none;flex-direction:column}
.slide.on{display:flex}
.kicker{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:15px;font-weight:700;margin-bottom:14px}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;line-height:1.08}
h1{font-size:104px}h2{font-size:48px;max-width:1000px}
.sub{color:var(--gold);font-size:28px;margin-top:10px}
p,li{font-size:23px;line-height:1.5;color:#e4e2f2;margin:0 0 14px}
.body{display:flex;gap:44px;flex:1;min-height:0;margin-top:22px}
.col{flex:1;min-width:0}
.quote{font-family:var(--serif);font-size:64px;color:var(--gold);margin:6px 0 14px;line-height:1.1}
.src{font-size:14px;color:var(--mute);margin-top:auto;padding-top:10px}
.title-s{justify-content:center}
.title-s p{font-size:34px;font-family:var(--serif);margin:0 0 6px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px}
.stat b{display:block;font-family:var(--serif);font-size:58px;color:var(--gold);line-height:1}
.stat span{display:block;font-size:17px;color:#cfcde6;margin-top:10px;line-height:1.4}
.shot{width:100%;border-radius:12px;border:1px solid var(--line);box-shadow:0 20px 60px #0008}
.imgcol{flex:1.35}.txt{flex:1}
.cta{display:inline-block;margin-top:8px;background:var(--gold);color:#241800;font-weight:700;font-size:20px;padding:12px 22px;border-radius:12px;text-decoration:none}
.draws{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.draws figure{margin:0}.draws img{width:100%;border-radius:10px;display:block;border:4px solid #f3ecdc}
.draws figcaption{font-size:16px;color:#d6d4ea;margin-top:8px;line-height:1.35}
.chart{display:flex;gap:18px;align-items:flex-end;height:120px;margin-top:14px}
.chart div{flex:1;text-align:center;font-size:15px;color:var(--mute)}
.chart i{display:block;border-radius:8px 8px 0 0;background:linear-gradient(var(--rose),var(--gold));margin-bottom:6px;position:relative}
.chart i b{position:absolute;top:-24px;left:0;right:0;color:var(--ink);font-size:20px}
.items{display:grid;gap:12px;margin-top:20px}
.item{display:grid;grid-template-columns:260px 1fr;gap:22px;padding:14px 22px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;align-items:center}
.item b{font-family:var(--serif);font-size:25px;color:var(--gold)}.item span{font-size:20px;color:#e4e2f2}
.sources li{font-size:15.5px;margin-bottom:8px;line-height:1.4}
#hud{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#777aa8;z-index:5}
#notes{position:fixed;left:0;right:0;bottom:0;background:#0d0d20f2;border-top:1px solid var(--line);padding:14px 24px;font-size:16px;color:#d7d5ee;display:none;z-index:6}
#notes.on{display:block}
@media print{html,body{overflow:visible;background:#fff}#stage{position:static;display:block}#deck{transform:none!important;width:auto;height:auto}
.slide{position:relative;display:flex!important;width:1280px;height:720px;page-break-after:always}#hud,#notes{display:none!important}@page{size:1280px 720px;margin:0}}
</style>
</head>
<body>
<div id="stage"><div id="deck"></div></div>
<div id="hud">← → or swipe · N = speaker notes · F = fullscreen</div>
<div id="notes"></div>
<script>
const DEMO = "../index.html#sim", IDE = "../ide.html";
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const ps = a => (a || []).map(t => `<p>${esc(t)}</p>`).join("");
const cta = s => s.cta ? `<a class="cta" href="${s.id === "hardware" ? IDE : DEMO}" target="_blank" rel="noopener">${esc(s.cta)} ↗</a>` : "";
const src = s => s.source ? `<div class="src">${esc(s.source)}</div>` : "";
const head = s => `<div class="kicker">${esc(s.kicker || "")}</div>`;
const R = {
  title: s => `<div class="slide title-s">${head(s)}<h1>${esc(s.title)}</h1><div class="sub">${esc(s.sub || "")}</div><div style="margin-top:44px">${ps(s.lines)}</div>${cta(s)}</div>`,
  story: s => `<div class="slide">${head(s)}<h2>${esc(s.title)}</h2><div class="body"><div class="col">${s.quote ? `<div class="quote">“${esc(s.quote)}”</div>` : ""}${ps(s.lines)}</div></div>${src(s)}</div>`,
  statement: s => `<div class="slide">${head(s)}<h2 style="font-size:64px">${esc(s.title)}</h2><div class="body"><div class="col" style="max-width:900px;margin-top:20px">${ps(s.lines)}</div></div></div>`,
  drawing: s => {
    const max = Math.max(...s.chart.values);
    const bars = s.chart.values.map((v, i) => `<div><i style="height:${Math.round(v / max * 70) + 8}px"><b>${v}</b></i>${esc(s.chart.labels[i])}</div>`).join("");
    return `<div class="slide">${head(s)}<h2>${esc(s.title)}</h2><div class="draws">${s.images.map((im, i) => `<figure><img src="${im}" alt=""><figcaption>${esc(s.captions[i])}</figcaption></figure>`).join("")}</div>
      <div style="display:flex;gap:30px;align-items:flex-end;margin-top:6px"><div style="width:480px"><div class="note" style="font-size:15px;color:var(--mute);margin-top:10px">${esc(s.chart.title)}</div><div class="chart">${bars}</div></div></div>${src(s)}</div>`;
  },
  stats: s => `<div class="slide">${head(s)}<h2>${esc(s.title)}</h2><div class="stats">${s.stats.map(x => `<div class="stat"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}</div><div style="margin-top:22px;max-width:1080px">${ps(s.lines)}</div>${src(s)}</div>`,
  image: s => `<div class="slide">${head(s)}<h2 style="font-size:42px">${esc(s.title)}</h2><div class="body"><div class="txt">${ps(s.lines)}${cta(s)}</div><div class="imgcol"><img class="shot" src="${s.image}" alt=""></div></div></div>`,
  list: s => `<div class="slide">${head(s)}<h2>${esc(s.title)}</h2><div class="items">${s.items.map(x => `<div class="item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}</div></div>`,
  sources: s => `<div class="slide">${head(s)}<h2 style="font-size:40px">${esc(s.title)}</h2><ol class="sources" style="margin-top:16px;padding-left:22px">${s.items.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`,
};
let slides = [], i = 0;
const deck = document.getElementById("deck"), notes = document.getElementById("notes");
function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 720); deck.style.transform = `scale(${k})`; }
function show(n) {
  i = Math.max(0, Math.min(slides.length - 1, n));
  [...deck.children].forEach((el, k) => el.classList.toggle("on", k === i));
  notes.textContent = slides[i].notes || ""; history.replaceState(null, "", "#" + (i + 1));
}
fetch("slides.json").then(r => r.json()).then(d => {
  slides = d; deck.innerHTML = d.map(s => (R[s.layout] || R.story)(s)).join("");
  show((parseInt(location.hash.slice(1)) || 1) - 1); fit();
});
addEventListener("resize", fit);
addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) show(i - 1);
  else if (e.key === "Home") show(0); else if (e.key === "End") show(slides.length - 1);
  else if (e.key.toLowerCase() === "n") notes.classList.toggle("on");
  else if (e.key.toLowerCase() === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
let x0 = null;
addEventListener("touchstart", e => x0 = e.touches[0].clientX);
addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
deck.addEventListener("click", e => { if (e.target.closest("a")) return; show(i + (e.clientX > innerWidth / 2 ? 1 : -1)); });
</script>
</body>
</html>
